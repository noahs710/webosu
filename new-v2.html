<script type="module">
  import "./src/shell/account-widget.js";
  import "./src/shell/beatmap-list.js";
  document.addEventListener("beatmap-launch", async (e) => {
    const { setId, beatmapId, version } = e.detail;
    try { const r = await fetch("https://catboy.best/d/" + setId + "n"); window.launchGame(new Blob([await r.arrayBuffer()]), beatmapId, version); }
    catch (err) { console.warn("launch failed:", err); }
  });
</script>

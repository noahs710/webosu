<!doctype html>
<html lang="en"><head>
<title>Search (lit shell v2)</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/font.css">
</head><body>
<nav id="main-nav">
  <div class="nav-link"><a href="index-v2.html" class="brand">webosu!</a><a href="browse-v2.html" class="pseudo button">Browse</a><a href="search-v2.html" class="pseudo button active">Search</a><a href="leaderboard-v2.html" class="pseudo button">Leaderboard</a></div>
  <div class="nav-search"><form id="searchform"><container id="searchbar" class="searchbar"><input type="text" id="q" placeholder="Search for a beatmap or enter a Set ID" /></container></form></div>
  <div class="nav-tool"><account-widget></account-widget></div>
</nav>
<div class="main-page"><div class="main-content">
  <h2>Search <span style="color:var(--lazer-dim);font-weight:400;font-size:.8em">lit + lazer-tokens</span></h2>
  <hr/>
  <beatmap-list id="list"></beatmap-list>
</div></div>
<script type="module">
  import "./src/shell/account-widget.js";
  import "./src/shell/beatmap-list.js";
  const list = document.getElementById("list");
  const input = document.getElementById("q");
  const form = document.getElementById("searchform");
  const initial = new URLSearchParams(location.search).get("q") || "";
  input.value = initial;

  // Build the API URL: if the query is a numeric Set ID, use the beatmapsets
  // endpoint (single-fetch, exact match). Otherwise use search with status
  // filtering (ranked + loved + qualified) for relevant results.
  function searchUrl(query) {
    const trimmed = query.trim();
    if (/^\d+$/.test(trimmed)) {
      return "https://catboy.best/api/v2/beatmapsets?ids=" + encodeURIComponent(trimmed);
    }
    const params = new URLSearchParams({
      q: trimmed, limit: 24, mode: 0,
    });
    // ranked + qualified + loved (most relevant for players)
    params.append("status", "1");
    params.append("status", "3");
    params.append("status", "4");
    return "https://catboy.best/api/v2/search?" + params;
  }

  function run(query) { list.setAttribute("src", searchUrl(query)); }

  // initial search from URL
  if (initial.trim()) run(initial);

  // debounced live search (300ms) with request cancellation — no unneeded calls
  let debounce = null;
  function liveSearch() {
    clearTimeout(debounce);
    debounce = setTimeout(() => {
      const v = input.value.trim();
      if (v.length >= 2 || /^\d+$/.test(v)) run(v);
    }, 300);
  }
  input.addEventListener("input", liveSearch);

  // form submit: immediate search (skip debounce)
  form.addEventListener("submit", (e) => { e.preventDefault(); clearTimeout(debounce); run(input.value); });
</script>
</body></html>
